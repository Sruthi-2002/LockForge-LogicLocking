<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081820"/><stop offset="0.55" stop-color="#0c2a33"/><stop offset="1" stop-color="#071a1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd9c0"/><stop offset="0.6" stop-color="#4aa3ff"/><stop offset="1" stop-color="#7a7cff"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bd48f" stop-opacity="0.5"/><stop offset="1" stop-color="#2bd48f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <ellipse cx="930" cy="90" rx="430" ry="260" fill="url(#glowT)"/>

  <!-- faint circuit traces -->
  <g stroke="#1b4450" stroke-width="2" fill="none" opacity="0.6">
    <path d="M0 330 H120 V300 H230"/><path d="M0 360 H180 V340 H300"/>
    <path d="M1200 70 H1080 V110 H980"/><path d="M60 60 H160 V95 H250"/>
    <circle cx="120" cy="330" r="4" fill="#1b4450" stroke="none"/>
    <circle cx="1080" cy="110" r="4" fill="#1b4450" stroke="none"/>
  </g>

  <!-- title block -->
  <text x="60" y="150" font-size="80" font-weight="800" fill="url(#title)" filter="url(#glow)" letter-spacing="1">LockForge</text>
  <text x="64" y="192" font-size="22" fill="#cfeee6" font-weight="600">MaxSAT-based logic locking · reproduction</text>
  <text x="64" y="222" font-size="15" fill="#7fa8a0" font-style="italic">Placing key-gates that conceal the circuit's exposed features.</text>

  <!-- key-gate pill -->
  <g transform="translate(64,250)">
    <rect width="300" height="30" rx="15" fill="#2bd48f" fill-opacity="0.12" stroke="#2bd48f" stroke-opacity="0.5"/>
    <text x="16" y="20" font-size="13" fill="#7ff0c0" font-family="'Courier New',monospace">out = wire &#8853; key   (SPS concealed)</text>
  </g>

  <!-- RIGHT: padlock + key-gate + concealment gauges -->
  <!-- padlock -->
  <g transform="translate(560,120)">
    <path d="M18 40 v-14 a24 24 0 0 1 48 0 v14" fill="none" stroke="#4aa3ff" stroke-width="7"/>
    <rect x="4" y="40" width="76" height="60" rx="10" fill="#0e2a33" stroke="#4aa3ff" stroke-width="3"/>
    <circle cx="42" cy="66" r="7" fill="#ffcf5c"/>
    <rect x="39" y="66" width="6" height="20" fill="#ffcf5c"/>
  </g>

  <!-- XOR key-gate symbol -->
  <g transform="translate(680,128)">
    <path d="M6 10 q14 34 0 68" fill="none" stroke="#3fd9c0" stroke-width="3"/>
    <path d="M14 10 q26 34 0 68 q40 -6 66 -34 q-26 -28 -66 -34 Z" fill="#0e2a33" stroke="#3fd9c0" stroke-width="3"/>
    <text x="30" y="49" font-size="20" fill="#3fd9c0" font-weight="700">=1</text>
    <line x1="80" y1="44" x2="118" y2="44" stroke="#3fd9c0" stroke-width="3"/>
    <text x="-70" y="30" font-size="12" fill="#7fa8a0" font-family="'Courier New',monospace">wire</text>
    <text x="-70" y="70" font-size="12" fill="#ffcf5c" font-family="'Courier New',monospace">key&#8201;&#9733;</text>
    <line x1="-30" y1="26" x2="14" y2="26" stroke="#7fa8a0" stroke-width="3"/>
    <line x1="-30" y1="64" x2="14" y2="64" stroke="#ffcf5c" stroke-width="3"/>
  </g>

  <!-- concealment gauges -->
  <g transform="translate(840,250)" font-family="'Courier New',monospace">
    <text x="0" y="-8" font-size="12" fill="#9fb8b2">signal-probability (exposed feature)</text>
    <!-- random: skewed -->
    <text x="0" y="18" font-size="12" fill="#ff6b6b">random</text>
    <rect x="80" y="6" width="230" height="14" rx="7" fill="#102a30" stroke="#24454c"/>
    <rect x="80" y="6" width="210" height="14" rx="7" fill="#ff6b6b" opacity="0.8"/>
    <text x="320" y="18" font-size="11" fill="#ff6b6b">skew&#8599;</text>
    <!-- maxsat: balanced ~0.5 -->
    <text x="0" y="44" font-size="12" fill="#2bd48f">MaxSAT</text>
    <rect x="80" y="32" width="230" height="14" rx="7" fill="#102a30" stroke="#24454c"/>
    <rect x="80" y="32" width="118" height="14" rx="7" fill="#2bd48f" opacity="0.85"/>
    <line x1="195" y1="30" x2="195" y2="48" stroke="#cfeee6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="320" y="44" font-size="11" fill="#2bd48f">&#8776;0.5</text>
  </g>
</svg>
